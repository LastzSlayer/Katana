<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVS Availability</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="container nav-inner">
    <a class="brand" href="index.html">⚔️ Katana</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="migration.html">Migration</a>
      <a href="glory-wars.html">Glory Wars</a>
      <a href="tutorials.html">Guides</a>
      <a href="svs.html">SVS</a>
      <a href="discord.html">Discord</a>
      <div id="google_translate_element"></div>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <h1>SVS Availability</h1>
      <p>Let leadership know if you're available for Saturday SVS and which group you will fight in.</p>

      <form 
        class="panel command-card form-grid"
        action="https://script.google.com/macros/s/AKfycbyPVHew-CfLeEOuBdS5w3lMU7Kf2FsLNRlPgfXgLLiU4qu-P7MFNXfDOdYrCR-MOvLEIA/exec"
        method="POST"
        target="hidden_iframe"
        onsubmit="return lockForm(this);"
      >

        <input type="text" name="player_name" placeholder="Player Name" required>

        <div class="full">
  <p><strong>Choose your SVS group:</strong></p>

  <div class="cards" style="grid-template-columns: repeat(2, 1fr);">

    <label class="card" style="cursor:pointer;">
      <input type="radio" name="svs_group" value="Mud Fighters" required>
      <div class="icon">🟫</div>
      <h3>Mud Fighters</h3>
      <p>Fight in Mud battles</p>
    </label>

    <label class="card" style="cursor:pointer;">
      <input type="radio" name="svs_group" value="Snow Fighters" required>
      <div class="icon">🌿</div>
      <h3>Snow Fighters</h3>
      <p>Fight in Snow battles</p>
    </label>

  </div>
</div>

        <select name="availability" required>
          <option value="">Availability</option>
          <option value="Available Saturday">Available Saturday</option>
          <option value="Not Available">Not Available</option>
        </select>
        <textarea 
  name="notes" 
  placeholder="Optional notes (e.g. timing, availability details)" 
  rows="3"
></textarea>

        <button type="submit" class="btn primary full">
          Submit SVS Availability
        </button>
        <input type="hidden" name="form_type" value="svs">

      </form>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-inner">
    <strong>⚔️ Katana Alliance</strong>
    <span>SVS coordination and planning</span>
  </div>
</footer>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
let formAlreadySubmitted = false;

function lockForm(form) {
  if (formAlreadySubmitted) return false;

  formAlreadySubmitted = true;

  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;
  button.innerText = "Submitting...";

  setTimeout(() => {
    window.location.href = "thankyou.html";
  }, 2000);

  return true;
}
</script>
<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
